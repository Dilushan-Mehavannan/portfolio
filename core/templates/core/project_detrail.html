{% extends "core/base.html" %}
{% block title %}{{ project.title }}{% endblock %}

{% block content %}
<div class="card">
    <div class="card-body">
        <h1 class="title-3d mb-1">{{ project.title }}</h1>
        <p class="text-muted mb-3">{{ project.tech_stack }}</p>

        <p>{{ project.description }}</p>

        <div class="mt-3 d-flex gap-2">
            {% if project.github_url %}
            <a href="{{ project.github_url }}" class="btn btn-dark btn-sm" target="_blank">GitHub</a>
            {% endif %}

            {% if project.live_url %}
            <a href="{{ project.live_url }}" class="btn btn-success btn-sm" target="_blank">Live</a>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
