<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Portfolio{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --bg-1: #05060f;
            --bg-2: #0b1024;
            --bg-3: #121a3a;
            --accent: #7c5cff;
            --accent-2: #22d3ee;
            --accent-3: #f472b6;
            --card-bg: rgba(20, 24, 48, 0.55);
            --card-border: rgba(124, 92, 255, 0.35);
            --text: #e6e9f2;
            --muted: #9aa3bf;
            --glow: 0 0 24px rgba(124, 92, 255, 0.35);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            min-height: 100%;
            color: var(--text);
            background: radial-gradient(1200px 700px at 10% -10%, #1a1f4a 0%, transparent 60%),
                        radial-gradient(900px 600px at 110% 10%, #2a1240 0%, transparent 55%),
                        linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-3) 100%);
            background-attachment: fixed;
            font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
        }

        /* perspective scene */
        .scene {
            perspective: 1200px;
            perspective-origin: 50% 30%;
        }

        /* floating orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.35;
            pointer-events: none;
            z-index: 0;
            animation: float 12s ease-in-out infinite;
        }
        .orb.a { width: 320px; height: 320px; background: var(--accent); top: -80px; left: -60px; }
        .orb.b { width: 260px; height: 260px; background: var(--accent-2); bottom: -60px; right: -40px; animation-delay: -4s; }
        .orb.c { width: 200px; height: 200px; background: var(--accent-3); top: 40%; left: 60%; animation-delay: -8s; }
        @keyframes float {
            0%, 100% { transform: translate3d(0,0,0) scale(1); }
            50% { transform: translate3d(0,-30px,0) scale(1.08); }
        }

        /* navbar glass */
        .navbar-glass {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(8, 10, 24, 0.6);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(124, 92, 255, 0.25);
            box-shadow: 0 8px 32px rgba(0,0,0,0.35);
        }
        .navbar-brand {
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(120deg, var(--accent), var(--accent-2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent !important;
        }

        /* 3D card */
        .card-3d, .card {
            position: relative;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            color: var(--text);
            transform-style: preserve-3d;
            transition: transform 0.35s cubic-bezier(.2,.8,.2,1), box-shadow 0.35s ease, border-color 0.35s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            overflow: hidden;
        }
        .card-3d::before, .card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(124,92,255,0.12), transparent 40%, rgba(34,211,238,0.08));
            pointer-events: none;
            z-index: 0;
        }
        .card-3d > *, .card > * { position: relative; z-index: 1; }
        .card-3d:hover, .card:hover {
            transform: translateY(-8px) rotateX(4deg) rotateY(-4deg) translateZ(12px);
            border-color: rgba(34, 211, 238, 0.6);
            box-shadow: 0 22px 50px rgba(0,0,0,0.55), var(--glow), inset 0 1px 0 rgba(255,255,255,0.1);
        }

        /* 3D button */
        .btn-3d, .btn {
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border-radius: 10px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .btn:hover { transform: translateY(-2px) translateZ(4px); }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #5a3df0);
            border: none;
            box-shadow: 0 6px 18px rgba(124,92,255,0.45);
        }
        .btn-primary:hover { box-shadow: 0 10px 26px rgba(124,92,255,0.6); }
        .btn-outline-primary {
            border-color: var(--accent);
            color: var(--accent);
        }
        .btn-outline-primary:hover {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 6px 18px rgba(124,92,255,0.45);
        }
        .btn-dark {
            background: rgba(20,24,48,0.8);
            border: 1px solid var(--card-border);
        }
        .btn-success {
            background: linear-gradient(135deg, #10b981, #059669);
            border: none;
            box-shadow: 0 6px 18px rgba(16,185,129,0.4);
        }

        /* headings with depth */
        .title-3d {
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(120deg, #ffffff, var(--accent-2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 8px 24px rgba(124,92,255,0.25);
            transform: translateZ(20px);
        }
        .lead { color: var(--muted); }

        /* footer */
        footer { color: var(--muted); border-top: 1px solid rgba(124,92,255,0.15); }

        /* tilt helper */
        .tilt { will-change: transform; }

        /* container spacing */
        main.container { position: relative; z-index: 1; }
    </style>
</head>
<body>
    <div class="orb a"></div>
    <div class="orb b"></div>
    <div class="orb c"></div>

    <nav class="navbar navbar-expand-lg navbar-glass">
        <div class="container">
            <a class="navbar-brand" href="/">My Portfolio</a>
            <div class="d-flex gap-2">
                <a class="btn btn-outline-primary btn-sm" href="/">Home</a>
                <a class="btn btn-outline-primary btn-sm" href="/projects/">Projects</a>
            </div>
        </div>
    </nav>

    <main class="container mt-4 scene">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center text-muted py-4 mt-5">
        © 2025 Your Name | Python Full-Stack Developer
    </footer>

    <script>
        // subtle 3D tilt on cards
        (function () {
            const cards = document.querySelectorAll('.card, .card-3d');
            cards.forEach(card => {
                card.classList.add('tilt');
                card.addEventListener('mousemove', (e) => {
                    const r = card.getBoundingClientRect();
                    const x = (e.clientX - r.left) / r.width - 0.5;
                    const y = (e.clientY - r.top) / r.height - 0.5;
                    card.style.transform = `perspective(900px) rotateY(${x * 12}deg) rotateX(${-y * 12}deg) translateZ(8px)`;
                });
                card.addEventListener('mouseleave', () => {
                    card.style.transform = '';
                });
            });
        })();
    </script>
</body>
</html>
