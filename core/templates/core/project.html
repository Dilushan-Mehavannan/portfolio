{% extends "core/base.html" %}
{% block title %}Projects{% endblock %}

{% block content %}
<h1 class="mb-4 title-3d">Projects</h1>

<div class="row g-4">
    {% for project in projects %}
    <div class="col-md-4">
        <div class="card h-100">
            <div class="card-body d-flex flex-column">
                <h5 class="fw-bold">{{ project.title }}</h5>
                <p class="text-muted flex-grow-1">{{ project.summary }}</p>
                <a href="{% url 'project_detail' project.slug %}" class="btn btn-outline-primary btn-sm align-self-start">
                    Details
                </a>
            </div>
        </div>
    </div>
    {% empty %}
    <div class="col-12">
        <div class="card"><div class="card-body text-center text-muted">No projects yet.</div></div>
    </div>
    {% endfor %}
</div>
{% endblock %}
